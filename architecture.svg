<text x="76" y="76" font-size="16" letter-spacing="3" fill="#648578">MONEYGRAPH / HACKALEM AI</text>
<text x="76" y="145" font-size="44" font-weight="600">От транзакций к объяснимым гипотезам</text>
<text x="76" y="190" font-size="21" fill="#7a898a">Локальные расчёты определяют роли. Аналитик проверяет основания.</text>
