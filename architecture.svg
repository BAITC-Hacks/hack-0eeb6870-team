<g font-size="23" font-weight="600"><text x="100" y="335">Три Parquet</text><text x="434" y="335">Граф и правила</text><text x="780" y="335">Роли и приоритеты</text><text x="1130" y="335">Рабочий экран</text></g>
<g font-size="18" fill="#6b8072"><text x="100" y="374">Узлы · связи · переводы</text><text x="100" y="408">Проверка согласованности</text><text x="100" y="442">Сохранение всех seed</text><text x="434" y="374">Метрики · Louvain · FIFO</text><text x="434" y="408">Учёт обрыва 4-го колена</text><text x="434" y="442">Без обучения модели</text><text x="780" y="374">Три CSV и основания</text><text x="780" y="408">Версионированный набор</text><text x="780" y="442">Воспроизводимый расчёт</text><text x="1130" y="374">Граф · поиск · карточки</text><text x="1130" y="408">Кластеры и топ-лист</text><text x="1130" y="442">Проверка гипотез</text></g>
