<text x="438" y="601" font-size="20" font-weight="600">NVIDIA API · необязательный ассистент</text>
<text x="438" y="641" font-size="18">Вопрос → вызов разрешённой функции → проверенные метрики → ответ со ссылками на gid</text>
<text x="438" y="675" font-size="16" fill="#6b8072">Не меняет роли или CSV. Без API доступны локальные ответы. Решения принимает аналитик.</text>
<text x="76" y="761" font-size="15" fill="#82917f">Один локальный запуск · без GPU · офлайн-интерфейс · гипотезы вместо обвинений</text>
