name: Verify MoneyGraph
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check moneygraph/static/app.js
      - run: node tests/ui_regressions.cjs
      - run: python run.py --demo --no-serve --out ci-results
      - run: python scripts/package_submission.py --data demo-data --out ci-submission
      - uses: actions/upload-artifact@v4
        with:
          name: demo-csv-${{ matrix.os }}
          path: ci-submission/
